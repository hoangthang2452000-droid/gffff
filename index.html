<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gửi em ❤️</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Pacifico&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style/style.css" />
</head>

<body>

  <!-- 🟢 MÀN HÌNH CLICK ĐẦU -->
  <div id="startScreen" style="
    position: fixed;
    inset: 0;
    background: black;
    color: white;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    cursor: pointer;">
    💖 Chạm để bắt đầu 💖
  </div>

  <!-- LOADER -->
  <div id="loader-container">
    <div class="loader-content">
      <div class="loader-heart"></div>
      <div class="progress-bar-container">
        <div id="progress-bar"></div>
      </div>
      <p id="progress-text">
        Loading... <span id="progress-percent">0%</span>
      </p>
    </div>
  </div>

  <canvas id="bg"></canvas>

  <!-- 🎵 AUDIO -->
  <audio id="backgroundMusic" preload="none">
    <source src="./style/Ngàn Năm Ánh Sáng.mp3" type="audio/mpeg" />
  </audio>

  <div class="click-me-container">
    <h2 id="clickMeText">NHẤN ĐỂ XEM</h2>
  </div>

  <div id="modalContainer" class="modal-container">
    <div class="modal-content">
      <span class="close-button">×</span>
      <h1>Gửi đến người đặc biệt với anh</h1>
      <div class="modal-body">
        <div class="text-content">
          <p id="typingText"></p>
          <p class="signature" style="opacity: 0; transition: opacity 1s;">
            Người thương em ❤️
          </p>
        </div>
        <div class="image-content" id="imageStack"></div>
      </div>
    </div>
  </div>

  <div id="lightboxModal" class="lightbox-modal">
    <span class="lightbox-close">×</span>
    <div class="lightbox-content">
      <img id="lightboxImage" src="" alt="Zoomed memory">
    </div>
  </div>

  <!-- ✅ THREE.JS -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>

  <!-- ❌ KHÔNG LOAD SCRIPT NGAY -->
  <!-- <script src="./style/script.js"></script> -->

  <!-- ✅ KHỞI ĐỘNG AN TOÀN CHO iOS 14–18 -->
  <script>
    const startScreen = document.getElementById("startScreen");
    const audio = document.getElementById("backgroundMusic");

    let appStarted = false;

    startScreen.addEventListener("click", () => {
      if (appStarted) return;
      appStarted = true;

      startScreen.style.display = "none";

      // iOS cần click để play audio
      audio.loop = true;
      audio.play().catch(() => {});

      // ✅ LOAD script.js SAU CLICK
      const script = document.createElement("script");
      script.src = "./style/script.js";
      script.onload = () => {
        // ✅ CHẶN LỖI ZALO iOS 14–15
        if (typeof window.zaloJSV2 === "undefined") {
          console.log("⚠️ Không có zaloJSV2 – iOS cũ, bỏ qua");
        }

        if (typeof startApp === "function") {
          startApp();
        } else {
          console.error("❌ startApp chưa tồn tại");
        }
      };

      document.body.appendChild(script);
    });
  </script>

</body>
</html>
